<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELSA - Registro de Pesaje</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --celsa-red: #E30613;
            --celsa-dark: #1A1A1A;
            --celsa-light-gray: #F5F5F7;
            --celsa-border: #D1D1D6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--celsa-light-gray);
            color: var(--celsa-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 0;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: #FFFFFF;
            height: auto; 
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-radius: 12px;
            overflow: visible;
        }

        header {
            border-top: 4px solid var(--celsa-red);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #FFFFFF;
            border-bottom: 1px solid var(--celsa-border);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .logo-box {
            background-color: var(--celsa-red);
            color: #FFFFFF;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 3px;
            text-align: center;
            display: inline-block;
        }

        .logo-sub {
            font-size: 8px;
            font-weight: bold;
            color: #000000;
            text-transform: uppercase;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .app-title {
            font-size: 13px;
            color: #666;
            font-weight: 600;
            max-width: 180px;
            text-align: right;
        }

        /* --- BOTÓN PARA ABRIR EL MENÚ (Ubicado en Header) --- */
        .menu-trigger-btn {
            background: none;
            border: none;
            font-size: 22px;
            color: var(--celsa-red);
            cursor: pointer;
            padding: 5px 0 5px 10px;
        }

        /* --- ESTRUCTURA DEL MENÚ LATERAL DERECHO --- */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .nav-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar-menu {
            position: fixed;
            top: 0;
            right: -320px; 
            width: 100%;
            max-width: 300px;
            height: 100vh;
            background-color: var(--celsa-red);
            box-shadow: -4px 0 15px rgba(0,0,0,0.1);
            z-index: 1000;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .sidebar-menu.active {
            right: 0;
        }

        .menu-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .menu-header h3 {
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 600;
        }

        .close-menu-btn {
            background: none;
            border: none;
            color: #FFFFFF;
            font-size: 22px;
            cursor: pointer;
        }

        .menu-links {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        .menu-links li {
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-links a {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 24px;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.2s, padding-left 0.2s;
        }

        .menu-links a:hover, .menu-links a:active {
            background-color: rgba(255, 255, 255, 0.08);
            padding-left: 30px;
            color: #FFFFFF;
        }

        .menu-links a i {
            font-size: 18px;
            width: 24px; 
            text-align: center;
            opacity: 0.9;
        }

        /* --- VISTAS / CONTENIDO VINCULADO --- */
        main {
            padding: 20px;
            flex: 1 0 auto;
        }

        .app-section {
            display: none;
            /* Ocultas por defecto */
        }

        .app-section.active-view {
            display: block;
            /* Solo se muestra la vista activa */
        }

        h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            border-left: 4px solid var(--celsa-red);
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            color: #8E8E93;
            font-size: 16px;
        }

        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 12px 12px 12px 38px;
            font-size: 15px;
            border: 1px solid var(--celsa-border);
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: var(--celsa-red);
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        /* Tarjetas de Pesaje Coherentes */
        .pesaje-frame {
            border: 1px solid var(--celsa-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #FAFAFC;
            position: relative;
        }

        .pesaje-frame-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .pesaje-frame-title {
            font-size: 13px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
        }

        .btn-remove-frame {
            background: none;
            border: none;
            color: var(--celsa-red);
            cursor: pointer;
            font-size: 16px;
        }

        .add-frame-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .btn-add-frame {
            background-color: #FFFFFF;
            color: var(--celsa-red);
            border: 2px solid var(--celsa-red);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .btn-add-frame:active {
            background-color: var(--celsa-red);
            color: #FFFFFF;
            transform: scale(0.95);
        }

        .photo-btn-trigger {
            background-color: var(--celsa-light-gray);
            border: 2px dashed var(--celsa-border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
        }

        .photo-btn-trigger i {
            font-size: 24px;
            color: var(--celsa-red);
            margin-bottom: 6px;
        }

        .photo-btn-trigger p {
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }

        .preview-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .preview-container {
            position: relative;
            width: 100%;
            padding-top: 100%;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--celsa-border);
        }

        .preview-container img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
        }

        .remove-photo-btn {
            position: absolute;
            top: 2px; right: 2px;
            background: rgba(223, 6, 19, 0.85);
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px; height: 20px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--celsa-red);
            color: #FFFFFF;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(227, 6, 19, 0.2);
        }

        .btn-submit:disabled {
            background-color: #999;
            box-shadow: none;
            cursor: not-allowed;
        }

        .loading-overlay {
            display: none;
            text-align: center;
            padding: 10px;
            color: var(--celsa-red);
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <header>
        <div>
            <div class="logo-box">CELSA</div>
            <div class="logo-sub">Conductores Eléctricos</div>
        </div>
        <div style="display: flex; align-items: center; gap: 5px;">
            <div class="app-title" id="headerTitle">Entrega de lingotes</div>
            <button class="menu-trigger-btn" onclick="toggleMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <nav class="sidebar-menu" id="sidebarMenu">
        <div class="menu-header">
            <h3>Menú</h3>
            <button class="close-menu-btn" onclick="toggleMenu()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        
        <ul class="menu-links">
            <li>
                <a href="#" onclick="switchView('entrega-lingotes', 'Entrega de lingotes')">
                    <i class="fa-solid fa-house"></i> Entrega de lingotes de cobre
                </a>
            </li>
            <li>
                <a href="#" onclick="switchView('trabajos', 'Traslado de Scrap Famia')">
                    <i class="fa-solid fa-briefcase"></i> Traslado de SCRAP (Cod. SP)
                </a>
            </li>
        </ul>
    </nav>

    <main>
        <div id="entrega-lingotes" class="app-section active-view">
            <h2>Nuevo Registro</h2>
            <form id="pesajeForm">
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-calendar"></i>
                        <input type="date" id="fecha" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tipo de Documento</label>
                    <div style="display: flex; gap: 20px; margin-top: 5px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="tipo_doc" value="boleta" checked onchange="conmutarDocumento()"> Boleta
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="tipo_doc" value="guia" onchange="conmutarDocumento()"> Guía
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <i id="icono-documento" class="fa-solid fa-ticket"></i>
                        <input type="text" id="numDoc" placeholder="Ej. 9778 / T005-9778" required>
                    </div>
                </div>

                <div id="pesajeFramesContainer"></div>

                <div class="add-frame-container">
                    <button type="button" class="btn-add-frame" onclick="LingotesApp.agregarNuevoFrame()">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <div class="form-group">
                    <label>Evidencias Fotográficas (Múltiples)</label>
                    <div class="photo-btn-trigger" onclick="document.getElementById('cameraFile').click();">
                        <i class="fa-solid fa-camera"></i>
                        <p>Capturar o añadir fotografía</p>
                    </div>
                    <input type="file" id="cameraFile" accept="image/*" style="display: none;" onchange="LingotesApp.procesarFoto(this)">
                    <div class="preview-gallery" id="gallery"></div>
                </div>

                <div class="loading-overlay" id="loadingText">
                    <i class="fa-solid fa-spinner fa-spin"></i> Subiendo datos y fotos a Google Drive...
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Registrar en Drive
                </button>
            </form>
        </div>

        <div id="trabajos" class="app-section">
            <h2>Nuevo Registro Scrap</h2>
            <form id="pesajeFormTrabajos">
                <div class="form-group">
                    <label for="fechaTrabajos">Fecha</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-calendar"></i>
                        <input type="date" id="fechaTrabajos" required>
                    </div>
                </div>

                <div id="pesajeFramesContainerTrabajos"></div>

                <div class="add-frame-container">
                    <button type="button" class="btn-add-frame" onclick="ScrapApp.agregarNuevoFrame()" title="Añadir pallet">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <div class="loading-overlay" id="loadingTextTrabajos">
                    <i class="fa-solid fa-spinner fa-spin"></i> Registrando datos en Drive...
                </div>

                <button type="submit" class="btn-submit" id="submitBtnTrabajos">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Registrar en Drive
                </button>
            </form>
        </div>
    </main>
</div>

<script>
// ============================================
// FUNCIONES COMPARTIDAS DEL MENÚ
// ============================================
function toggleMenu() {
    const menu = document.getElementById('sidebarMenu');
    const overlay = document.getElementById('navOverlay');
    menu.classList.toggle('active');
    overlay.classList.toggle('active');
}

function switchView(viewId, shortTitle) {
    document.querySelectorAll('.app-section').forEach(section => {
        section.classList.remove('active-view');
    });
    document.getElementById(viewId).classList.add('active-view');
    document.getElementById('headerTitle').textContent = shortTitle;
    toggleMenu();
}
</script>

<script>
// ============================================
// APP 1: MÓDULO DE LINGOTES DE COBRE
// ============================================
const LingotesApp = (() => {
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxqCvaZpXpCpBsi6-oeoDgaes4ZhqR0Sn3BU7bK9X0NSVHqz5BeQYWrNybGUewgcRxzLw/exec";
    
    let listaFotosBase64 = [];
    let frameCounter = 0;

    // Inicialización
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('fecha').valueAsDate = new Date();
        agregarNuevoFrame();
    });

    function conmutarDocumento() {
        const tipo = document.querySelector('input[name="tipo_doc"]:checked').value;
        const icono = document.getElementById('icono-documento');
        icono.className = (tipo === 'boleta') ? "fa-solid fa-ticket" : "fa-solid fa-file-invoice";
    }

    function agregarNuevoFrame() {
        frameCounter++;
        const container = document.getElementById('pesajeFramesContainer');
        const frame = document.createElement('div');
        frame.className = 'pesaje-frame';
        frame.id = `frame_${frameCounter}`;
        
        const deleteButton = frameCounter > 1 ? 
            `<button type="button" class="btn-remove-frame" onclick="LingotesApp.eliminarFrame(${frameCounter})">
                <i class="fa-solid fa-trash-can"></i>
            </button>` : '';
        
        frame.innerHTML = `
            <div class="pesaje-frame-header">
                <span class="pesaje-frame-title">PALLET #${frameCounter}</span>
                ${deleteButton}
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>P. Bruto (kg)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-weight-scale"></i>
                        <input type="number" step="0.1" class="p_bruto" placeholder="0.0" oninput="LingotesApp.calcularNetoFrame(this)" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tara (kg)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-box"></i>
                        <input type="number" step="0.1" class="tara" placeholder="0.0" oninput="LingotesApp.calcularNetoFrame(this)" required>
                    </div>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>P. Neto (kg)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calculator"></i>
                    <input type="number" class="p_neto" placeholder="Cálculo automático" readonly style="background-color: #F2F2F7; font-weight: 600;">
                </div>
            </div>
        `;
        container.appendChild(frame);
        renumerarFrames();
    }

    function eliminarFrame(id) {
        const frame = document.getElementById(`frame_${id}`);
        if(frame) {
            frame.remove();
            renumerarFrames();
        }
    }

    function renumerarFrames() {
        const titles = document.querySelectorAll('#pesajeFramesContainer .pesaje-frame-title');
        titles.forEach((title, index) => {
            title.textContent = `PALLET #${index + 1}`;
        });
    }

    function calcularNetoFrame(inputEl) {
        const frame = inputEl.closest('.pesaje-frame');
        const bruto = parseFloat(frame.querySelector('.p_bruto').value) || 0;
        const tara = parseFloat(frame.querySelector('.tara').value) || 0;
        const neto = bruto - tara;
        frame.querySelector('.p_neto').value = neto > 0 ? neto.toFixed(1) : 0;
    }

    function procesarFoto(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result.split(',')[1];
                listaFotosBase64.push(base64String);
                renderizarGaleria();
            };
            reader.readAsDataURL(file);
            input.value = ""; 
        }
    }

    function renderizarGaleria() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = "";
        listaFotosBase64.forEach((base64, index) => {
            const container = document.createElement('div');
            container.className = "preview-container";
            container.innerHTML = `
                <img src="data:image/jpeg;base64,${base64}" alt="Vista previa">
                <button type="button" class="remove-photo-btn" onclick="LingotesApp.eliminarFoto(${index})">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            `;
            gallery.appendChild(container);
        });
    }

    function eliminarFoto(index) {
        listaFotosBase64.splice(index, 1);
        renderizarGaleria();
    }

    // Manejo del formulario
    document.getElementById('pesajeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const loadingText = document.getElementById('loadingText');
        
        submitBtn.disabled = true;
        loadingText.style.display = "block";
    
        const listaPesajes = [];
        document.querySelectorAll('#pesajeFramesContainer .pesaje-frame').forEach(frame => {
            listaPesajes.push({
                p_bruto: frame.querySelector('.p_bruto').value,
                tara: frame.querySelector('.tara').value,
                p_neto: frame.querySelector('.p_neto').value
            });
        });

        const fotosPuras = listaFotosBase64.map(f => typeof f === 'object' ? f.base64.split(',')[1] || f.base64 : f);

        const payload = {
            fecha: document.getElementById('fecha').value,
            tipo_documento: document.querySelector('input[name="tipo_doc"]:checked').value,  
            numero_documento: document.getElementById('numDoc').value, 
            pesajes: listaPesajes, 
            fotos: fotosPuras 
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then((resultado) => {
            if (resultado.status === "success") {
                alert("¡Registro exitoso! Los datos y fotos se guardaron correctamente.");
                document.getElementById('pesajeForm').reset();
                document.getElementById('fecha').valueAsDate = new Date();
                document.getElementById('pesajeFramesContainer').innerHTML = "";
                frameCounter = 0;
                agregarNuevoFrame();
                listaFotosBase64 = [];
                renderizarGaleria();
            } else {
                alert("Error en el script de Drive: " + resultado.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un problema al enviar los datos.");
        })
        .finally(() => {
            submitBtn.disabled = false;
            loadingText.style.display = "none";
        });
    });

    // Exponer API pública
    return {
        agregarNuevoFrame,
        eliminarFrame,
        calcularNetoFrame,
        procesarFoto,
        eliminarFoto
    };
})();

// Exponer función de conmutar documento al ámbito global
window.conmutarDocumento = LingotesApp.conmutarDocumento || function() {
    const tipo = document.querySelector('input[name="tipo_doc"]:checked').value;
    const icono = document.getElementById('icono-documento');
    icono.className = (tipo === 'boleta') ? "fa-solid fa-ticket" : "fa-solid fa-file-invoice";
};
</script>

<script>
// ============================================
// APP 2: MÓDULO DE SCRAP
// ============================================
const ScrapApp = (() => {
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyW0hJI5d65Ex4gQkKM-GCNAZxNsMT7bkjVqk8Ck-VBAivuZvMmHfv-nDI1BAugk26C9g/exec";
    
    let frameCounter = 0;

    // Inicialización
    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('fechaTrabajos').valueAsDate = new Date();
        agregarNuevoFrame();
    });

    function agregarNuevoFrame() {
        frameCounter++;
        const container = document.getElementById('pesajeFramesContainerTrabajos');
        const frame = document.createElement('div');
        frame.className = 'pesaje-frame';
        frame.id = `frame_trabajos_${frameCounter}`;
        
        const deleteButton = frameCounter > 1 ?
            `<button type="button" class="btn-remove-frame" onclick="ScrapApp.eliminarFrame(${frameCounter})">
                <i class="fa-solid fa-trash"></i>
            </button>` : '';
        
        frame.innerHTML = `
            <div class="pesaje-frame-header">
                <span class="pesaje-frame-title">Pesaje #${frameCounter}</span>
                ${deleteButton}
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Origen de Scrap</label>
                    <div style="display: flex; gap: 20px; margin-top: 12px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="origen_scrap_${frameCounter}" value="Producción" required> Producción
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="origen_scrap_${frameCounter}" value="Logistica"> Logística 
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Código SP</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" class="cod_sp" placeholder="Ej. SP-000${frameCounter}">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Tipo de Scrap</label>
                <div style="display: flex; flex-wrap: wrap; gap: 24px; margin-top: 8px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="tipo_scrap_${frameCounter}" value="Primera" onchange="ScrapApp.evaluarScrap(${frameCounter})" required> Primera
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="tipo_scrap_${frameCounter}" value="Segunda" onchange="ScrapApp.evaluarScrap(${frameCounter})"> Segunda 
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="tipo_scrap_${frameCounter}" value="Tercera" onchange="ScrapApp.evaluarScrap(${frameCounter})"> Tercera 
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="tipo_scrap_${frameCounter}" value="Cobre" onchange="ScrapApp.evaluarScrap(${frameCounter})"> Cobre
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="tipo_scrap_${frameCounter}" value="PVC" onchange="ScrapApp.evaluarScrap(${frameCounter})"> PVC
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="tipo_scrap_${frameCounter}" value="LSOH" onchange="ScrapApp.evaluarScrap(${frameCounter})"> LSOH
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="radio" name="tipo_scrap_${frameCounter}" value="XLPE" onchange="ScrapApp.evaluarScrap(${frameCounter})"> XLPE
                    </label>
                </div>
            </div>
            
            <div id="contenedor_scrap_${frameCounter}" class="form-row" style="display: none;">
                <div class="form-group">
                    <label>Condición de Scrap (Plástico)</label>
                    <div style="display: flex; gap: 20px; margin-top: 12px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="scrap_${frameCounter}" value="Limpio"> Limpio
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="scrap_${frameCounter}" value="Purga"> Purga 
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="scrap_${frameCounter}" value="Contaminado"> Contaminado 
                        </label>
                    </div>
                </div>
            </div>
            
            <div id="contenedor_scrapCu_${frameCounter}" class="form-row" style="display: none;">
                <div class="form-group">
                    <label>Condición de Scrap (Cu)</label>
                    <div style="display: flex; gap: 20px; margin-top: 12px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="scrapCu_${frameCounter}" value="Buen estado"> Buen estado
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="scrapCu_${frameCounter}" value="Quemado"> Quemado
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="scrapCu_${frameCounter}" value="Cinta Cu"> Cinta de cobre
                        </label>
                    </div>
                </div>
            </div>

            <div id="contenedor_proceso_${frameCounter}" class="form-row">
                <div class="form-group">
                    <label>Siguiente Proceso</label>
                    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="tipo_proceso_${frameCounter}" value="Venta"> Venta
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="tipo_proceso_${frameCounter}" value="Segregación"> Segregación
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="tipo_proceso_${frameCounter}" value="Compactado"> Compactado
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="tipo_proceso_${frameCounter}" value="Moler"> Moler
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="radio" name="tipo_proceso_${frameCounter}" value="Picar"> Picar
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>P. Bruto (kg)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-weight-scale"></i>
                        <input type="number" step="0.1" class="p_bruto" placeholder="0.0" oninput="ScrapApp.calcularNetoFrame(this)" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tara (kg)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-box"></i>
                        <input type="number" step="0.1" class="tara" placeholder="0.0" oninput="ScrapApp.calcularNetoFrame(this)" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>P. Neto (kg)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calculator"></i>
                    <input type="number" class="p_neto" placeholder="Cálculo automático" readonly style="background-color: #F2F2F7; font-weight: 600;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label>Observación</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-comment-dots" style="position: absolute; left: 12px; color: #8E8E93;"></i>
                    <input type="text" class="observacion" placeholder="Añadir un comentario u observación..." style="padding-left: 38px;">
                </div>
            </div>
        `;
        container.appendChild(frame);
        renumerarFrames();
    }

    function eliminarFrame(id) {
        const frame = document.getElementById(`frame_trabajos_${id}`);
        if (frame) {
            frame.remove();
            renumerarFrames();
        }
    }

    function renumerarFrames() {
        const frames = document.querySelectorAll('#pesajeFramesContainerTrabajos .pesaje-frame');
        frames.forEach((frame, index) => {
            const title = frame.querySelector('.pesaje-frame-title');
            if (title) title.textContent = `Caja #${index + 1}`;
        });
    }

    function calcularNetoFrame(inputEl) {
        const frame = inputEl.closest('.pesaje-frame');
        const bruto = parseFloat(frame.querySelector('.p_bruto').value) || 0;
        const tara = parseFloat(frame.querySelector('.tara').value) || 0;
        const neto = bruto - tara;
        frame.querySelector('.p_neto').value = neto > 0 ? neto.toFixed(1) : 0;
    }

    function evaluarScrap(frameId) {
        const seleccionado = document.querySelector(`input[name="tipo_scrap_${frameId}"]:checked`);
        const divPlastico = document.getElementById(`contenedor_scrap_${frameId}`);
        const divCu = document.getElementById(`contenedor_scrapCu_${frameId}`);
        const divProceso = document.getElementById(`contenedor_proceso_${frameId}`);
        
        if (seleccionado && divPlastico && divProceso && divCu) {
            const valor = seleccionado.value;
            if (valor === "PVC" || valor === "LSOH" || valor === "XLPE") {
                divPlastico.style.display = "flex";
                divProceso.style.display = "flex";
                divCu.style.display = "none";
                desmarcarRadio(divCu);
            } else if (valor === "Cobre") {
                divCu.style.display = "flex";
                divProceso.style.display = "flex";
                divPlastico.style.display = "none";
                desmarcarRadio(divPlastico);
            } else {
                divPlastico.style.display = "none";
                divCu.style.display = "none";
                desmarcarRadio(divPlastico);
                desmarcarRadio(divCu);
                desmarcarRadio(divProceso);
            }
        }
    }

    function desmarcarRadio(contenedor) {
        const radios = contenedor.querySelectorAll('input[type="radio"]');
        radios.forEach(radio => radio.checked = false);
    }

    document.getElementById('pesajeFormTrabajos').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtnTrabajos');
        const loadingText = document.getElementById('loadingTextTrabajos');
        
        submitBtn.disabled = true;
        loadingText.style.display = "block";

        const listaPesajes = [];
        const frames = document.querySelectorAll('#pesajeFramesContainerTrabajos .pesaje-frame');
        
        frames.forEach(frame => {
            const frameId = frame.id.replace('frame_trabajos_', '');
            
            const origenEl = frame.querySelector(`input[name="origen_scrap_${frameId}"]:checked`);
            const origenScrap = origenEl ? origenEl.value : "";
            
            const codSp = frame.querySelector('.cod_sp').value;
            
            const tipoEl = frame.querySelector(`input[name="tipo_scrap_${frameId}"]:checked`);
            const tipoScrap = tipoEl ? tipoEl.value : "";
            
            const scrapPlasticoEl = frame.querySelector(`input[name="scrap_${frameId}"]:checked`);
            const scrapPlastico = scrapPlasticoEl ? scrapPlasticoEl.value : "";
            
            const scrapCUEl = frame.querySelector(`input[name="scrapCu_${frameId}"]:checked`);
            const scrapCU = scrapCUEl ? scrapCUEl.value : "";
            
            const tipoProcesoEl = frame.querySelector(`input[name="tipo_proceso_${frameId}"]:checked`);
            const tipoProceso = tipoProcesoEl ? tipoProcesoEl.value : "";
            
            const pBruto = frame.querySelector('.p_bruto').value;
            const tara = frame.querySelector('.tara').value;
            const pNeto = frame.querySelector('.p_neto').value;
            const observacion = frame.querySelector('.observacion').value;

            listaPesajes.push({
                origen_scrap: origenScrap,
                codigo_sp: codSp,
                tipo_scrap: tipoScrap,
                tipo_proceso: tipoProceso,
                condicion_scrapPlastico: scrapPlastico, 
                condicion_scrapCu: scrapCU,
                p_bruto: pBruto,
                tara: tara,
                p_neto: pNeto,
                observacion: observacion
            });
        });

        const payload = {
            fecha: document.getElementById('fechaTrabajos').value,
            pesajes: listaPesajes
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then((resultado) => {
            if(resultado.status === "success") {
                alert("¡Registro exitoso! Todos los pesos se guardaron correctamente.");
                document.getElementById('pesajeFormTrabajos').reset();
                document.getElementById('fechaTrabajos').valueAsDate = new Date();
                document.getElementById('pesajeFramesContainerTrabajos').innerHTML = "";
                frameCounter = 0;
                agregarNuevoFrame();
            } else {
                alert("Error en el script: " + resultado.message);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Hubo un problema al procesar el envío.");
        })
        .finally(() => {
            submitBtn.disabled = false;
            loadingText.style.display = "none";
        });
    });

    // Exponer API pública
    return {
        agregarNuevoFrame,
        eliminarFrame,
        calcularNetoFrame,
        evaluarScrap
    };
})();
</script>

</body>
</html>
